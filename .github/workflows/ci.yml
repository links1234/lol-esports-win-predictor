name: CI

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install project
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Build package
        run: uv build

      - name: Test
        run: uv run pytest --cov=src/lolpredictor --cov-report=term-missing --cov-fail-under=85

      - name: Run complete fixture workflow
        run: uv run lolpredictor run-all --workdir var/ci-run
