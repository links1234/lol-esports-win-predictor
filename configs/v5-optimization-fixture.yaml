study_name: synthetic-v5-nested
base_config: v5-optimization-fixture-base.yaml
development_cutoff_timestamp: 2026-01-01T00:00:00+00:00
random_seed: 20260730
trial_count: 30
timeout_hours: 0.25
worker_count: 4

nested_validation:
  outer_fold_count: 2
  inner_fold_count: 2
  validation_fraction_per_fold: 0.10
  test_fraction_per_fold: 0.10
  calibration_fraction_within_train: 0.10

allocation:
  cached_feature_trials_per_outer: 10
  replay_feature_trials_per_outer: 5
  families:
    - logistic_regression
    - histogram_gradient_boosting
    - catboost
    - elo_catboost_blend
    - dynamic_bradley_terry

selection:
  maximum_expected_calibration_error: 0.20
  maximum_major_league_log_loss_regression: 0.10
  minimum_breakdown_sample_count: 10
  require_no_inner_fold_regression_vs_elo: false
  fallback_candidate: elo_catboost_regional_raw_blend_50

feature_replay_space:
  elo_k_factor: [18.0, 24.0]
  player_elo_k_factor: [9.0, 12.0]
  region_elo_k_factor: [9.0, 12.0]
  form_window: [8, 10]
  rate_prior_strength: [9.0, 12.0]
  player_champion_prior_strength: [6.0, 8.0]
  synergy_prior_strength: [18.0, 24.0]
  matchup_prior_strength: [15.0, 20.0]
  rating_half_life_days: [240.0, 365.0]

search_space:
  logistic_c: [0.05, 1.0]
  histogram_learning_rate: [0.03, 0.10]
  histogram_iterations: [10, 30]
  histogram_max_leaf_nodes: [4, 10]
  histogram_l2_regularization: [0.5, 5.0]
  catboost_iterations: [10, 30]
  catboost_depth: [3, 5]
  catboost_learning_rate: [0.03, 0.10]
  catboost_l2_leaf_regularization: [3.0, 12.0]
  catboost_random_strength: [0.0, 1.0]
  catboost_rsm: [0.70, 1.0]
  elo_blend_weight: [0.25, 0.75]
  bradley_terry_c: [0.01, 1.0]
  bradley_terry_recency_half_life_days: [120.0, 500.0]
  bradley_terry_player_weight: [0.25, 1.25]
  bradley_terry_champion_weight: [0.10, 1.0]

calibration_methods:
  logistic_regression: [native, platt]
  histogram_gradient_boosting: [native, platt]
  catboost: [native, platt]
  elo_catboost_blend: [native, platt]
  dynamic_bradley_terry: [native, platt]
