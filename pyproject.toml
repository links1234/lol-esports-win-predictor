[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lol-esports-win-predictor"
version = "0.2.0"
description = "Chronologically evaluated League of Legends esports win probabilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "lol-draft-predictor contributors" }]
dependencies = [
  "catboost>=1.2.10,<2",
  "duckdb>=1.3.2,<2",
  "joblib>=1.5.1,<2",
  "numpy>=2.2.6,<2.5",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.3.1,<4",
  "pillow>=11.3,<13",
  "pydantic>=2.11.7,<3",
  "pytz>=2025.2",
  "pyyaml>=6.0.2,<7",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7.1,<2",
]

[project.scripts]
lolpredictor = "lolpredictor.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0,<2",
  "pandas-stubs>=2.3.0.250703,<3",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.5,<1",
  "types-pyyaml>=6.0.12.20250516,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lolpredictor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "e2e: complete command-line workflow tests",
  "integration: tests spanning storage, features, training, and artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src/lolpredictor"]

[[tool.mypy.overrides]]
module = [
  "catboost.*",
  "duckdb.*",
  "joblib.*",
  "scipy.*",
  "sklearn.*",
  "threadpoolctl.*",
]
ignore_missing_imports = true
